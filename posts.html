<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="posts.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <title>Journal Posts</title>
    <script defer src="script.js"></script>
    <script defer src="postHandler.js"></script>
  </head>
  <body>
    <header>
      <nav>
        <a class="logo pink" href="/index.html">Journal</a>

        <a style="margin-left: auto" href="/index.html">Home</a>
        <a href="#">About</a>
        <a href="#">Features</a>
        <a href="#">Docs</a>
        <a href="#">Pricing</a>
        <a href="/posts.html">Posts</a>
        <a style="margin-left: auto" href="/register.html" class="pink"
          >Register</a
        >
        <a href="#" class="pink login">Log In</a>

        <svg
          class="menu_icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
      </nav>
      <!-- Mobile Nav -->
      <div class="mobile_nav">
        <a href="/index.html">Home</a>
        <a href="#">About</a>
        <a href="#">Features</a>
        <a href="#">Docs</a>
        <a href="#">Pricing</a>
        <a href="/posts.html">Posts</a>
        <a href="/register.html" class="">Register</a>
        <a href="#" class="">Log In</a>
      </div>
    </header>

    <main>
      <h1>Submit and Read Your Posts</h1>
      <form>
        <div>
          <label for="title">Post Title</label>
          <input
            type="text"
            name="title"
            id="title"
            placeholder="Enter your post's title"
          />
        </div>
        <div>
          <label for="body">Post Body</label>
          <textarea name="body" id="body" cols="30" rows="10"></textarea>
        </div>
        <button type="submit" id="savePosts" class="btn">Save Post</button>
      </form>
      <section id="readPosts"></section>
    </main>
  </body>
</html>
